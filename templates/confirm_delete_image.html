<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Image Deletion</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/productconfirmdelete">
</head>
<body>

    <div class="confirmation-container">
        <h1>Are you sure you want to delete this image?</h1>
        <p>This action cannot be undone. Please confirm if you want to delete this image permanently.</p>
        
        <div class="image-container">
            <img src="{{ image.image.url }}" alt="Additional Image">
        </div>

        <form method="POST">
            {% csrf_token %}
            <button type="submit">Yes, delete this image</button>
            <a href="{% url 'productupdates' product.id %}" class="cancel-link">Cancel</a>
        </form>
    </div>

</body>
</html>
