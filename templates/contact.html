{% load static %}
{% include 'header.html' %}

<style>
        nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    background-color: transparent;
    z-index: 1000;
    padding: 20px 0;  
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); 
}
</style>
<div class="container" id="contact" style="padding-top: 100px;">
    <div>
        <h2 style="text-align: center;  font-weight: bold;
        color: #b57f2f;
        font-family: 'Cinzel', serif;">Contact Us</h2>
    </div>
    
    <div class="contact-section">
        <!-- Contact Form -->
        <div class="contact-form">
          <form action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="b6032bf3-e836-43d1-a873-600a084c1da1">
                <div>
                    <div class="col-12 col-md-4 mb-4">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" id="name" name="full_name" class="form-control" placeholder="Enter your name" required>
                    </div>
                    <div class="col-12 col-md-4 mb-4">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required>
                    </div>
                    <div class="col-12 col-md-4 mb-4">
                        <label for="message" class="form-label">Message</label>
                        <textarea id="message" name="message" class="form-control" rows="4" placeholder="Your message" required></textarea>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn w-100" style="background-color: goldenrod">Send Message</button>
                    </div>
                </div>
            </form>
        </div>
        

        <div class="map">
    
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3928.874821987296!2d76.30582827503154!3d10.027187290079635!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3b080dafbed183bf%3A0x5951f316ba13a37e!2sLuLu%20International%20Shopping%20Mall!5e0!3m2!1sen!2sin!4v1738317216130!5m2!1sen!2sin" width="100%" height="400" style="border:0;" allowfullscreen="" loading="lazy"> </iframe>
        </div>
    </div>
</div>
